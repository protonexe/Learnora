<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <!-- Book icon -->
  <g fill="white">
    <!-- Left page -->
    <path d="M128 120 L256 150 L256 380 L128 350 Z" opacity="0.9"/>
    <!-- Right page -->
    <path d="M384 120 L256 150 L256 380 L384 350 Z" opacity="0.95"/>
    <!-- Spine highlight -->
    <rect x="252" y="145" width="8" height="240" opacity="0.3"/>
    <!-- Stars/sparkles for "smart" -->
    <circle cx="340" cy="180" r="8"/>
    <circle cx="370" cy="220" r="6"/>
    <circle cx="150" cy="200" r="7"/>
  </g>
  <!-- "L" letter accent -->
  <text x="256" y="300" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="white" text-anchor="middle" opacity="0.15">L</text>
</svg>
